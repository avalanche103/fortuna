services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET}
      SITE_URL: ${SITE_URL:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - fortuna-data:/data

volumes:
  fortuna-data:
